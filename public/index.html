<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Diskwala Video Downloader</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f1115;
        --card: #181b22;
        --line: #2a2f3a;
        --fg: #e7e9ee;
        --muted: #9aa3b2;
        --accent: #4f8cff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        display: flex;
        justify-content: center;
        padding: 48px 20px;
      }
      main { width: 100%; max-width: 720px; }
      h1 { font-size: 24px; margin: 0 0 6px; }
      p.sub { color: var(--muted); margin: 0 0 28px; }
      form { display: flex; gap: 10px; flex-wrap: wrap; }
      input[type='url'] {
        flex: 1 1 320px;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--fg);
        font-size: 15px;
      }
      input[type='url']:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
      button {
        padding: 12px 20px;
        border-radius: 10px;
        border: 0;
        background: var(--accent);
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      button[disabled] { opacity: 0.6; cursor: default; }
      .msg {
        margin-top: 20px;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--card);
      }
      .msg.error { border-color: #6b2a2a; color: #ffb4b4; }
      .result { margin-top: 24px; }
      .src {
        border: 1px solid var(--line);
        background: var(--card);
        border-radius: 12px;
        padding: 14px 16px;
        margin-bottom: 12px;
      }
      .src .meta { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
      .src code {
        display: block;
        word-break: break-all;
        font-size: 12.5px;
        color: var(--muted);
        margin-bottom: 10px;
      }
      a.dl {
        display: inline-block;
        padding: 8px 14px;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
      }
      a.plain { color: var(--accent); font-size: 14px; }
      .note { color: var(--muted); font-size: 13px; margin-top: 32px; }
      pre.hint {
        background: #000;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
        overflow-x: auto;
        font-size: 12.5px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Diskwala Video Downloader</h1>
      <p class="sub">Paste a public Diskwala video page URL to fetch its direct media link.</p>

      <form id="form">
        <input
          id="url"
          type="url"
          required
          placeholder="https://diskwala.com/..."
          autocomplete="off"
          spellcheck="false"
        />
        <button id="go" type="submit">Fetch</button>
      </form>

      <div id="out"></div>

      <p class="note">
        Only works for publicly accessible pages. Download only what you have the right to
        download.
      </p>
    </main>

    <script>
      const form = document.getElementById('form');
      const input = document.getElementById('url');
      const go = document.getElementById('go');
      const out = document.getElementById('out');

      const esc = (s) =>
        String(s).replace(/[&<>"']/g, (c) =>
          ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]
        );

      function show(html) {
        out.innerHTML = html;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        go.disabled = true;
        show('<div class="msg">Resolving…</div>');
        try {
          const res = await fetch('/api/resolve', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ url: input.value }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Request failed.');
          render(data);
        } catch (err) {
          show(`<div class="msg error">${esc(err.message)}</div>`);
        } finally {
          go.disabled = false;
        }
      });

      function render(data) {
        const items = data.sources
          .map((s) => {
            const action =
              s.kind === 'file'
                ? `<a class="dl" href="${esc(s.downloadPath)}">Download ${esc(s.filename)}</a>`
                : `<a class="plain" href="${esc(s.url)}" target="_blank" rel="noopener">Open ${esc(
                    s.kind.toUpperCase()
                  )} manifest</a>
                   <pre class="hint">ffmpeg -i "${esc(s.url)}" -c copy "${esc(
                     s.filename.replace(/\.\w+$/, '.mp4')
                   )}"</pre>`;
            return `<div class="src">
                <div class="meta">${esc(s.kind)} · found via ${esc(s.via)}</div>
                <code>${esc(s.url)}</code>
                ${action}
              </div>`;
          })
          .join('');

        show(`<div class="result">
            <div class="msg"><strong>${esc(data.title)}</strong></div>
            ${items}
          </div>`);
      }
    </script>
  </body>
</html>
